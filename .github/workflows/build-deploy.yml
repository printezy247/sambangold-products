name: Build & Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  docs:
    name: README & assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify README renders on GitHub
        run: bash scripts/check-readme.sh

  app:
    name: Python app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The application code does not exist yet. Each step below runs only
      # once its inputs are present, so this job passes on a docs-only repo
      # and starts doing real work the moment the code lands.
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt yet — skipping install."
          fi

      - name: Syntax check
        run: |
          if compgen -G "app/*.py" > /dev/null; then
            python -m py_compile app/*.py
          else
            echo "No app/*.py yet — skipping syntax check."
          fi

      - name: Tests
        run: |
          if compgen -G "tests/test_*.py" > /dev/null || compgen -G "test_*.py" > /dev/null; then
            pip install "pytest>=7"
            pytest -q
          else
            echo "No tests yet — skipping pytest."
          fi

# Deploy is Railway's job, not CI's: Railway watches this repo directly (once
# the project is connected in the Railway dashboard) and redeploys `master`
# from the Dockerfile on every push that lands after this workflow passes.
# See railway.json for build/health config.
