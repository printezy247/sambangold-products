{% with heading="ui.s_h_inf", button="ui.audit", text_placeholder="ui.s_ph_inf" %}{% include "tools/_scanner.html" %}{% endwith %}

<h2>{{ t('ui.l_title') }}</h2>
<p class="lede">{{ t('ui.l_lede') }}</p>
<form method="post" action="{{ url_for('views.influencer_loss_report') }}" class="panel tool">
  <div class="fields">
    <label>{{ t('ui.l_handle') }} <input name="handle" placeholder="@gold_guru" required></label>
    <label>{{ t('ui.l_platform') }} <input name="platform" placeholder="TikTok, Instagram, Telegram…"></label>
    <label>{{ t('ui.l_broker') }} <input name="broker" placeholder="{{ t('ui.optional') }}"></label>
    <label>{{ t('ui.l_amount') }} <input name="amount" placeholder="5000"></label>
    <label>{{ t('ui.l_currency') }} <input name="currency" placeholder="MYR / USD"></label>
    <label>{{ t('ui.l_date') }} <input name="date" placeholder="2026-08-01 – 2026-08-20"></label>
  </div>
  <label class="wide" style="display:block;margin-top:14px">{{ t('ui.l_story') }}
    <textarea name="story" rows="6" placeholder="{{ t('ui.l_story_ph') }}"></textarea>
  </label>
  <div class="actions"><button type="submit" class="btn-gold">{{ t('ui.l_download') }}</button></div>
</form>
