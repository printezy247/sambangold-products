# fly.toml app configuration file generated for sambangold-products on 2026-09-15T02:22:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sambangold-products'
primary_region = 'ams'

[build]

[env]
  DATABASE_PATH = '/data/sambangold.db'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
