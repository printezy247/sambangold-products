# Fly.io — one app carries all eighteen products.
# Secrets (TELEGRAM_BOT_TOKEN, FLASK_SECRET_KEY, TASK_TOKEN, PUBLIC_BASE_URL,
# ADMIN_TELEGRAM_ID) are set with `fly secrets set`, never here.

app = "sambangold-products"
primary_region = "ams"

[build]

[env]
  DATABASE_PATH = "/data/sambangold.db"

# Persistent disk for SQLite. Free-tier machines lose their filesystem on
# every restart; the volume does not.
[mounts]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
