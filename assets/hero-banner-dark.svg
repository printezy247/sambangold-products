<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Sambangold — 18 trading products">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a13"/><stop offset="100%" stop-color="#0d1b30"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f0b429" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b429"><animate attributeName="stop-color" values="#f0b429;#00e5ff;#ff4d6d;#f0b429" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#ff4d6d;#f0b429;#00e5ff" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2b4a" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 -40;0 0" dur="14s" repeatCount="indefinite"/>
  </rect>

  <ellipse cx="250" cy="120" rx="320" ry="220" fill="url(#glow)">
    <animate attributeName="rx" values="320;380;320" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1040" cy="230" rx="300" ry="200" fill="url(#glow2)">
    <animate attributeName="ry" values="200;250;200" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- orbital rig -->
  <g transform="translate(1075,160)" fill="none">
    <circle r="112" stroke="#f0b429" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="112" ry="42" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="112" ry="42" stroke="#ff4d6d" stroke-opacity="0.28" stroke-width="1.5" transform="rotate(60)">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="58" fill="#f0b429" fill-opacity="0.10" stroke="#f0b429" stroke-opacity="0.55" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.55;0.95;0.55" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text y="14" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="42" font-weight="bold" fill="url(#title)">18</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle cx="112" cy="0" r="6" fill="#f0b429"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="16s" repeatCount="indefinite"/>
      <circle cx="112" cy="0" r="5" fill="#00e5ff"/>
    </g>
  </g>

  <!-- candles -->
  <g stroke-linecap="round">
    <g stroke="#34d399" fill="#34d399">
      <rect x="86" y="236" width="12" height="40" rx="2"><animate attributeName="height" values="40;62;40" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y" values="236;214;236" dur="3.2s" repeatCount="indefinite"/></rect>
      <rect x="126" y="220" width="12" height="56" rx="2"><animate attributeName="height" values="56;34;56" dur="4.1s" repeatCount="indefinite"/><animate attributeName="y" values="220;242;220" dur="4.1s" repeatCount="indefinite"/></rect>
    </g>
    <g stroke="#ff4d6d" fill="#ff4d6d">
      <rect x="106" y="246" width="12" height="30" rx="2"><animate attributeName="height" values="30;50;30" dur="3.7s" repeatCount="indefinite"/><animate attributeName="y" values="246;226;246" dur="3.7s" repeatCount="indefinite"/></rect>
      <rect x="146" y="252" width="12" height="24" rx="2"><animate attributeName="height" values="24;44;24" dur="2.9s" repeatCount="indefinite"/><animate attributeName="y" values="252;232;252" dur="2.9s" repeatCount="indefinite"/></rect>
    </g>
    <g stroke="#f0b429" fill="#f0b429">
      <rect x="166" y="228" width="12" height="48" rx="2"><animate attributeName="height" values="48;68;48" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y" values="228;208;228" dur="3.4s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Verdana,DejaVu Sans,sans-serif">
    <text x="86" y="126" font-size="58" font-weight="bold" fill="url(#title)" letter-spacing="-1">SAMBANGOLD</text>
    <text x="90" y="166" font-size="19" fill="#8fa3c0" letter-spacing="5">TRADING INTELLIGENCE STACK</text>
    <text x="90" y="204" font-size="16" fill="#e8f0ff" opacity="0.75">9 shipped &#183; 9 proposed &#183; Telegram bots + Flask web &#183; free tier on every one</text>
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
  </g>

  <rect y="316" width="1280" height="4" fill="url(#sweep)"/>
  <rect width="1280" height="4" fill="url(#sweep)"/>
</svg>
