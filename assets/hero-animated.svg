<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" style="display:block">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.15">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#f0b429" stroke-width="3" opacity="0.6" stroke-dasharray="8 6">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="-360 100 100" dur="25s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="105" text-anchor="middle" font-family="Orbitron,sans-serif" font-size="28" font-weight="900" fill="#e8f0ff" letter-spacing="6">9</text>
</svg>
