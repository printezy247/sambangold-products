<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380" role="img" aria-label="SAMBANGGOLD mascot hammering a gold bar">
  <defs>
    <radialGradient id="chrome" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d9dee6"/><stop offset=".75" stop-color="#8f99a8"/><stop offset="1" stop-color="#4b5462"/></radialGradient>
    <linearGradient id="chromeCap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d7684"/><stop offset=".3" stop-color="#e9edf2"/><stop offset=".55" stop-color="#b7c0ce"/><stop offset="1" stop-color="#5b6470"/></linearGradient>
    <radialGradient id="goldBall" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff0b0"/><stop offset=".4" stop-color="#e2b93a"/><stop offset="1" stop-color="#7a4003"/></radialGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7c04a"/><stop offset="1" stop-color="#b08a1e"/></linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff0b0"/><stop offset="1" stop-color="#e2b93a"/></linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a97c16"/><stop offset="1" stop-color="#7a4003"/></linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c2129"/><stop offset=".5" stop-color="#3a4250"/><stop offset="1" stop-color="#0a0d12"/></linearGradient>
    <radialGradient id="visor" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#3a4250"/><stop offset="1" stop-color="#05070a"/></radialGradient>
    <radialGradient id="flash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      @keyframes swing{0%{transform:rotate(40deg)}38%{transform:rotate(46deg)}48%{transform:rotate(-3deg)}56%{transform:rotate(0deg)}100%{transform:rotate(40deg)}}
      @keyframes lean{0%{transform:rotate(3deg)}38%{transform:rotate(4deg)}48%{transform:rotate(-2deg)}100%{transform:rotate(3deg)}}
      @keyframes burst{0%,44%{opacity:0;transform:translate(0,0) scale(.4)}50%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1)}80%{opacity:0;transform:translate(calc(var(--dx)*1.6),calc(var(--dy)*1.6 + 30px)) scale(.6)}100%{opacity:0}}
      @keyframes flash{0%,45%{opacity:0}49%{opacity:1}62%{opacity:0}100%{opacity:0}}
      @keyframes barhit{0%,46%{transform:translateY(0)}49%{transform:translateY(3px)}56%{transform:translateY(0)}100%{transform:translateY(0)}}
      .arm{transform-origin:222px 128px;animation:swing 2.6s cubic-bezier(.4,0,.2,1) infinite}
      .torso{transform-origin:262px 240px;animation:lean 2.6s ease-in-out infinite}
      .shard{transform-origin:center;animation:burst 2.6s ease-out infinite}
      .flash{animation:flash 2.6s ease-out infinite}
      .bar{animation:barhit 2.6s ease-out infinite}
      @media (prefers-reduced-motion:reduce){.arm,.torso,.shard,.flash,.bar{animation:none}.arm{transform:rotate(0deg)}.shard{opacity:.9}}
    </style>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="210" cy="345" rx="170" ry="16" fill="#000" opacity=".45" filter="url(#soft)"/>

  <!-- anvil -->
  <g>
    <path d="M60,320 L82,262 L218,262 L240,320 Q150,352 60,320 Z" fill="url(#graphite)"/>
    <ellipse cx="150" cy="320" rx="90" ry="20" fill="#0e1218"/>
    <ellipse cx="150" cy="262" rx="70" ry="14" fill="#2a303a"/>
    <ellipse cx="150" cy="262" rx="70" ry="14" fill="none" stroke="#12161d" stroke-width="7"/>
    <ellipse cx="150" cy="262" rx="70" ry="14" fill="none" stroke="#55606e" stroke-width="1.5" opacity=".8"/>
  </g>

  <!-- gold bar -->
  <g class="bar">
    <polygon points="92,228 208,228 226,216 110,216" fill="url(#goldTop)"/>
    <polygon points="208,228 226,216 226,252 208,264" fill="url(#goldSide)"/>
    <rect x="92" y="228" width="116" height="36" fill="url(#goldFace)"/>
    <path d="M118,242 Q150,238 176,246" fill="none" stroke="#7a4003" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <path d="M118,241 Q150,237 176,245" fill="none" stroke="#ffe08a" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  </g>
  <ellipse class="flash" cx="150" cy="226" rx="70" ry="22" fill="url(#flash)"/>

  <!-- shards -->
  <g fill="url(#goldBall)" stroke="#7a4003" stroke-width=".6">
    <polygon class="shard" style="--dx:-46px;--dy:-58px" points="120,200 128,190 136,200 128,210"/>
    <polygon class="shard" style="--dx:-70px;--dy:-30px" points="100,210 106,203 112,210 106,217"/>
    <polygon class="shard" style="--dx:-30px;--dy:-84px" points="130,196 135,190 140,196 135,202"/>
    <polygon class="shard" style="--dx:-88px;--dy:-64px" points="96,198 103,190 110,198 103,206"/>
    <polygon class="shard" style="--dx:-56px;--dy:-100px" points="118,190 122,185 126,190 122,195"/>
    <polygon class="shard" style="--dx:-104px;--dy:-20px" points="84,214 88,209 92,214 88,219"/>
  </g>

  <!-- legs + feet (static) -->
  <g>
    <rect x="318" y="306" width="72" height="22" rx="3" fill="#20252e"/>
    <polygon points="318,306 390,306 402,298 330,298" fill="#3a4250"/>
    <rect x="182" y="312" width="66" height="22" rx="3" fill="#20252e"/>
    <polygon points="182,312 248,312 260,304 194,304" fill="#3a4250"/>
    <path d="M262,240 L330,300" stroke="url(#chromeCap)" stroke-width="30" stroke-linecap="round"/>
    <path d="M262,240 L222,300" stroke="url(#chromeCap)" stroke-width="30" stroke-linecap="round"/>
    <path d="M322,300 L360,300" stroke="url(#chromeCap)" stroke-width="26" stroke-linecap="round"/>
    <path d="M222,300 L216,318" stroke="url(#chromeCap)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="262" cy="240" r="30" fill="url(#chrome)"/>
  </g>

  <!-- torso -->
  <g class="torso">
    <path d="M232,120 L266,220" stroke="url(#chromeCap)" stroke-width="66" stroke-linecap="round"/>
    <path d="M232,120 L266,220" stroke="url(#chromeCap)" stroke-width="66" stroke-linecap="round" opacity=".0"/>
    <ellipse cx="248" cy="170" rx="33" ry="52" fill="url(#chrome)" opacity=".55" transform="rotate(-19 248 170)"/>
    <path d="M226,208 Q262,222 300,204" fill="none" stroke="#d4af37" stroke-width="4"/>
    <path d="M226,208 Q262,222 300,204" fill="none" stroke="#fff0b0" stroke-width="1" opacity=".7"/>
    <!-- head -->
    <circle cx="214" cy="90" r="34" fill="url(#chrome)"/>
    <path d="M186,78 Q214,64 246,84 L246,104 Q214,118 186,100 Z" fill="url(#visor)"/>
    <path d="M190,82 Q214,72 240,86" fill="none" stroke="#6b7684" stroke-width="1.2" opacity=".6"/>
    <ellipse cx="200" cy="64" rx="11" ry="5" fill="#fff" opacity=".6" transform="rotate(-25 200 64)"/>
    <!-- shoulder -->
    <circle cx="222" cy="128" r="20" fill="url(#goldBall)"/>
    <ellipse cx="216" cy="120" rx="6" ry="3.5" fill="#fff" opacity=".7"/>
  </g>

  <!-- arm + hammer (animated) -->
  <g class="arm">
    <path d="M222,128 L184,152" stroke="url(#chromeCap)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="184" cy="152" r="12" fill="url(#chrome)"/>
    <path d="M184,152 L158,186" stroke="#20252e" stroke-width="16" stroke-linecap="round"/>
    <circle cx="158" cy="186" r="9" fill="url(#goldBall)"/>
    <!-- handle -->
    <path d="M158,186 L112,238" stroke="#20252e" stroke-width="12" stroke-linecap="round"/>
    <path d="M154,190 L120,228" stroke="#454d5a" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <!-- head -->
    <g transform="translate(112 238) rotate(-48)">
      <rect x="-18" y="-30" width="36" height="60" rx="4" fill="url(#goldFace)"/>
      <rect x="-18" y="-30" width="36" height="12" rx="3" fill="url(#goldTop)"/>
      <rect x="-18" y="18" width="36" height="12" rx="3" fill="url(#goldSide)"/>
      <rect x="-12" y="-24" width="6" height="48" rx="2" fill="#fff0b0" opacity=".35"/>
    </g>
  </g>
</svg>
