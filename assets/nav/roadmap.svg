<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 38" width="92" height="38" role="img" aria-label="ROADMAP">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0.06"/>
