  <circle cx="20" cy="19" r="4" fill="#a78bfa"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="54" y="24" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11.5" fill="#dce7fa" letter-spacing="1.4">ROADMAP</text>
